<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">
<style>
/* Fonts are local so the file renders offline. Outfit has no Vietnamese glyphs: it is used for digits only. */
@font-face{font-family:'PJS';font-weight:200 800;src:url(../assets/fonts/plus-jakarta-sans-vietnamese-wght-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'PJS';font-weight:200 800;src:url(../assets/fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0}
@font-face{font-family:'PJS';font-weight:200 800;src:url(../assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'OutfitNum';font-weight:100 900;src:url(../assets/fonts/outfit-latin-wght-normal.woff2) format('woff2')}
:root{--obsidian:#070D20;--amethyst:#6B2D9B;--violet:#9B4DFF;--cobalt:#245BFF;--lavender:#E9D5FF;--ice:#63B4FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--obsidian)}
body{position:relative;font-family:'PJS',sans-serif;color:#fff}
.layer{position:absolute;inset:0;pointer-events:none}
#plate{background:url(../assets/plates/purple_opt01_hero_convergence.jpg) center/cover;transform-origin:78% 55%}
#bloom{mix-blend-mode:screen;background:radial-gradient(520px 640px at 1700px 600px,rgba(255,255,255,.55),rgba(190,150,255,.28) 38%,transparent 72%)}
#sheen{mix-blend-mode:overlay;left:900px;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);background-size:60% 100%;background-repeat:no-repeat}
#aurora{mix-blend-mode:screen;background:radial-gradient(960px 700px at 72% 46%,rgba(155,77,255,.30),rgba(36,91,255,.18) 48%,transparent 80%),radial-gradient(680px 520px at 24% 50%,rgba(107,45,155,.26),transparent 85%)}
#readable{background:linear-gradient(90deg,rgba(7,11,28,.80) 0,rgba(12,16,42,.58) 34%,rgba(18,14,48,.26) 50%,transparent 62%)}
/* Soft fades behind the two logo bands so partner logos stay legible. No boxes. */
#fadeTop{background:linear-gradient(180deg,rgba(7,13,32,.78) 0,rgba(7,13,32,.40) 120px,transparent 230px)}
#fadeBot{background:linear-gradient(0deg,rgba(7,13,32,.95) 0,rgba(7,13,32,.74) 140px,transparent 300px)}
#streaks{z-index:3}
.band{position:absolute;left:74px;right:74px;z-index:10;display:flex;gap:40px}
#top{top:50px}
#bottom{bottom:50px;height:118px;align-items:stretch}
#bottom .col:first-child{display:flex;align-items:flex-end}
.col{position:relative;padding-top:16px}
.col::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,rgba(233,213,255,.6),rgba(233,213,255,.16));transform:scaleX(var(--rule,1));transform-origin:left}
.cap{font-weight:600;font-size:14px;color:rgba(233,213,255,.78);margin-bottom:14px;opacity:var(--cap,1)}
.slot{height:64px;display:flex;align-items:center;gap:40px;opacity:var(--cap,1)}
.slot img{max-height:60px;max-width:200px;object-fit:contain;filter:brightness(0) invert(1);opacity:.92}
.col.org .slot img{filter:none;opacity:1;max-height:64px}
.guides .slot{outline:1px dashed rgba(99,180,255,.7);outline-offset:4px;color:rgba(99,180,255,.95);font-size:12px;font-weight:600;justify-content:center}
.guides .slot::after{content:attr(data-size)}
#title{position:absolute;left:74px;top:300px;z-index:10;white-space:nowrap}
.wipe{display:block;clip-path:inset(-60% 100% -60% -80px);will-change:clip-path}
.t-eyebrow{font-weight:600;font-size:38px;letter-spacing:.42em;color:var(--lavender);text-shadow:0 0 24px rgba(155,77,255,.85);margin-bottom:6px;padding:.3em 0 0}
.t-row{display:flex;align-items:baseline;gap:26px}
.t-main{font-weight:800;font-size:134px;line-height:.94;letter-spacing:-.03em;text-shadow:0 0 28px rgba(155,77,255,.65),0 0 64px rgba(36,91,255,.55)}
#yr{width:430px;height:132px;overflow:visible;filter:drop-shadow(0 0 16px rgba(155,77,255,.85)) drop-shadow(0 0 34px rgba(36,91,255,.6))}
/* The gradient box now includes room above and below the caps, so Ề / Ễ / Ẵ keep their full diacritics. */
.t-region{font-weight:800;font-size:92px;line-height:1.04;letter-spacing:-.015em;margin-top:-2px;padding:.3em .05em .1em;margin-bottom:-.1em;background:linear-gradient(90deg,#fff 0,#F3E8FF 48%,#93C5FD 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(155,77,255,.7));display:inline-block}
.t-theme{margin-top:30px;display:flex;align-items:center;gap:22px}
.t-theme i{display:block;width:84px;height:2px;background:linear-gradient(90deg,var(--violet),var(--ice));box-shadow:0 0 14px var(--violet);transform:scaleX(var(--ln,1));transform-origin:left}
.t-theme span{font-weight:500;font-size:31px;letter-spacing:.005em;color:#F3E8FF;text-shadow:0 0 20px rgba(155,77,255,.6)}
.info{display:flex;gap:46px;white-space:nowrap}
.info div{position:relative;opacity:var(--o,1)}
.info b{display:block;font-weight:800;font-size:29px;letter-spacing:.01em;text-shadow:0 0 20px rgba(155,77,255,.55)}
.info small{display:block;font-weight:600;font-size:14px;color:var(--ice);margin-bottom:6px}
.info div+div::before{content:"";position:absolute;left:-23px;top:6px;bottom:2px;width:1px;background:linear-gradient(180deg,transparent,rgba(155,77,255,.9),transparent)}
</style></head><body>
<div class="layer" id="plate"></div>
<div class="layer" id="aurora"></div>
<div class="layer" id="bloom"></div>
<div class="layer" id="sheen"></div>
<div class="layer" id="readable"></div>
<div class="layer" id="fadeTop"></div>
<div class="layer" id="fadeBot"></div>
<svg class="layer" id="streaks" viewBox="0 0 1920 1080" width="1920" height="1080">
 <defs><linearGradient id="sg" x1="1" x2="0"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#63B4FF"/><stop offset="1" stop-color="#9B4DFF" stop-opacity="0"/></linearGradient>
 <filter id="gl"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <g fill="none" stroke="url(#sg)" stroke-linecap="round" filter="url(#gl)" mix-blend-mode="screen">
  <path class="st" d="M1560 790C1250 750 820 790 140 870" stroke-width="2.2"/>
  <path class="st" d="M1580 835C1200 815 780 835 340 885" stroke-width="1.6"/>
  <path class="st" d="M1540 700C1320 660 1060 660 880 700" stroke-width="1.4"/>
 </g>
</svg>

<!-- TOP BAND: left free for organizer and sponsor logos. Fill via window.PARTNERS or drop PNGs in assets/partners/ -->
<div class="band" id="top">
 <div class="col org" style="width:330px"><div class="cap">Đơn vị tổ chức</div><div class="slot" data-slot="organizer" data-size="330×64"><img src="../assets/vmaa_logo_white_transparent.png" alt="VMAA"></div></div>
 <div class="col" style="flex:1"><div class="cap">Nhà tài trợ đồng hành</div><div class="slot" data-slot="sponsor-main" data-size="Nhà tài trợ đồng hành · 440×64"></div></div>
 <div class="col" style="flex:1"><div class="cap">Nhà tài trợ vàng</div><div class="slot" data-slot="sponsor-gold" data-size="Nhà tài trợ vàng · 440×64"></div></div>
 <div class="col" style="flex:1"><div class="cap">Đối tác học thuật</div><div class="slot" data-slot="academic" data-size="Đối tác học thuật · 440×64"></div></div>
</div>

<div id="title">
 <span class="wipe t-eyebrow" id="w1">DIỄN ĐÀN</span>
 <div class="t-row">
  <span class="wipe t-main" id="w2">M&amp;A</span>
  <svg id="yr" viewBox="0 0 430 132"><text id="yrT" x="0" y="116" font-family="OutfitNum" font-weight="800" font-size="118" letter-spacing="-2" fill="rgba(233,213,255,0)" stroke="#E9D5FF" stroke-width="2.2">2026</text></svg>
 </div>
 <span class="wipe t-region" id="w3">MIỀN TRUNG</span>
 <div class="t-theme"><i id="ln"></i><span class="wipe" id="w4">Kiến trúc giá trị: Bất động sản × Công nghệ</span></div>
</div>

<!-- BOTTOM BAND: logistics left, support and media partner slots right -->
<div class="band" id="bottom">
 <div class="col" style="width:760px"><div class="info" id="info">
  <div><small>Ngày</small><b>13.12.2026</b></div>
  <div><small>Giờ</small><b>13:30–17:30</b></div>
  <div><small>Địa điểm</small><b>Đà Nẵng, Việt Nam</b></div></div></div>
 <div class="col" style="flex:1"><div class="cap">Đơn vị hỗ trợ</div><div class="slot" data-slot="support" data-size="Đơn vị hỗ trợ · 466×64"></div></div>
 <div class="col" style="flex:1"><div class="cap">Đối tác truyền thông</div><div class="slot" data-slot="media" data-size="Đối tác truyền thông · 466×64"></div></div>
</div>

<script>
window.PARTNERS = window.PARTNERS || {}; // e.g. {"sponsor-gold":["../assets/partners/abc.png"]}
const q=new URLSearchParams(location.search);
if(q.get('guides'))document.body.classList.add('guides');
document.querySelectorAll('.slot').forEach(s=>(PARTNERS[s.dataset.slot]||[]).forEach(u=>{if(s.dataset.slot!=='organizer'){const i=new Image();i.src=u;s.appendChild(i)}}));

const T=10, clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,a,d)=>clamp((t-a)/d);
const eo=x=>1-Math.pow(1-x,4), eio=x=>x<.5?8*x**4:1-Math.pow(-2*x+2,4)/2;
const $=id=>document.getElementById(id), cols=[...document.querySelectorAll('.col')];
const yr=$('yrT'), L=2200; // fixed length > outline length, so nothing shows before the draw starts
yr.style.strokeDasharray=`${L} ${L}`;
function render(t){
  const g=eo(P(t,0,2.8));                       // light ramps up from the dark
  const pl=$('plate'); pl.style.transform=`scale(${1.1-.1*eo(P(t,0,T))})`; pl.style.filter=`brightness(${.32+.76*g}) contrast(1.08) saturate(${.8+.36*g})`;
  $('bloom').style.opacity=(.25+.75*g)*(.9+.1*Math.sin(t*1.6));
  const sp=((t-3.4)/4.2); $('sheen').style.opacity=sp<0||sp>1?0:Math.sin(sp*Math.PI)*.85; $('sheen').style.backgroundPosition=`${-40+sp*180}% 0`;
  document.querySelectorAll('.st').forEach((p,i)=>{const len=p.getTotalLength(),h=P(t,2.2+i*.35,2.4),run=(t*.28+i*.37)%1;
    p.style.strokeDasharray=`${len*.16} ${len}`; p.style.strokeDashoffset=-(len*(1.1*run-.1)); p.style.opacity=eo(h)*(t>2.2?1:0)*.9;});
  const wp=(id,a,d)=>{const e=eio(P(t,a,d));$(id).style.clipPath=`inset(-60% ${100-112*e}% -60% -80px)`};
  wp('w1',1,.9);wp('w2',1.35,.9);wp('w3',2.2,1.0);wp('w4',3.1,.9);
  $('w1').style.letterSpacing=`${.42+.5*(1-eo(P(t,1,1.4)))}em`;
  const yd=eio(P(t,1.8,1.8)); yr.style.strokeDashoffset=L*(1-yd); yr.style.fill=`rgba(233,213,255,${.0+.10*eo(P(t,3.2,1.2))})`;
  $('ln').style.setProperty('--ln',eo(P(t,2.9,.8)));
  cols.forEach((c,i)=>{c.style.setProperty('--rule',eio(P(t,.5+i*.12,1)));c.style.setProperty('--cap',eo(P(t,1.1+i*.12,.8)))});
  [...$('info').children].forEach((d,i)=>d.style.setProperty('--o',eo(P(t,3.5+i*.25,.7))));
}
window.__seek=t=>{render(t)};
const hold=q.get('hold'); if(q.has('t')||hold){render(hold?T:+q.get('t'))}
else{let s=performance.now();const f=n=>{render(((n-s)/1000)%(T+2)>T?T:((n-s)/1000)%(T+2));requestAnimationFrame(f)};requestAnimationFrame(f)}
</script></body></html>
